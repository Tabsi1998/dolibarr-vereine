name: Fehler melden / Bug report
description: Etwas funktioniert nicht wie beschrieben. / Something does not work as documented.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine echten Mitglieds-, Spender- oder Bankdaten, Zugangsdaten, API-Schlüssel oder Datenbank-Dumps.
        Please do not include real member, donor or bank data, credentials, API keys or database dumps.
        Sicherheitsprobleme / security problems: https://github.com/Tabsi1998/dolibarr-vereine/security/advisories/new
  - type: input
    id: module
    attributes:
      label: Vereine-Version / Vereine version
      placeholder: 0.1.0-beta
    validations:
      required: true
  - type: dropdown
    id: dolibarr
    attributes:
      label: Dolibarr-Version / Dolibarr version
      options: ["24.x", "23.x", "22.x", "andere / other"]
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP-Version / PHP version
      placeholder: "8.2"
  - type: dropdown
    id: profile
    attributes:
      label: Länderprofil / Country profile
      options: ["Österreich / Austria", "Deutschland / Germany"]
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen / Steps to reproduce
      placeholder: |
        1. Mitglieder > Verein öffnen
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartet und tatsächlich / Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Fehlermeldungen / Error messages
      description: Aus dem Browser oder dem Dolibarr-Log (dolibarr.log), ohne personenbezogene Daten. / From the browser or dolibarr.log, without personal data.
      render: text
