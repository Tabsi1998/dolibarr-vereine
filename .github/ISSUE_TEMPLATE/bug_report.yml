name: Fehler melden
description: Etwas funktioniert nicht wie beschrieben.
title: "[Fehler] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine echten Mitglieds-, Spender- oder Bankdaten, Zugangsdaten, API-Schlüssel oder Datenbankauszüge.
        Sicherheitsprobleme privat melden: https://github.com/Tabsi1998/dolibarr-vereine/security/advisories/new
  - type: input
    id: module
    attributes:
      label: Vereine-Version
      placeholder: 0.5.8-beta
    validations:
      required: true
  - type: dropdown
    id: dolibarr
    attributes:
      label: Dolibarr-Version
      options: ["24.x", "23.x", "22.x", "andere"]
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP-Version
      placeholder: "8.2"
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Mitglieder > Verein öffnen
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartet und tatsächlich
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Fehlermeldungen
      description: Aus dem Browser oder dem Dolibarr-Log (dolibarr.log), ohne personenbezogene Daten.
      render: text
