name: Funktion vorschlagen
description: Eine neue Funktion oder Verbesserung.
title: "[Idee] "
labels: [enhancement]
body:
  - type: textarea
    id: why
    attributes:
      label: Warum
      description: Welche Aufgabe im Verein soll das lösen?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag
    validations:
      required: true
  - type: textarea
    id: legal
    attributes:
      label: Rechtsgrundlage
      description: Paragraph oder Quelle, falls es um gesetzliche Vorgaben geht.
